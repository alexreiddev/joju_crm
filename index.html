<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Growth CRM</title>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#1a5c2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Green Growth">
    <meta name="description" content="Green Growth CRM - Sales & Business Management">

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- ApexCharts CDN -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
</head>
<body class="login-mode">
    <!-- Top Navbar -->
    <nav class="top-navbar" id="topNavbar">
        <div class="nav-left">
            <div class="logo">
                <i class="fa-solid fa-leaf logo-icon"></i>
            </div>
            <button class="hamburger" id="menuToggle">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
        <div class="nav-right">
            <button class="nav-btn search-btn" id="searchToggle">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
            <div class="user-avatar" id="profileToggle">
                <img src="https://ui-avatars.com/api/?name=User&background=e8d5d0&color=333&size=40" alt="User" id="navAvatar">
            </div>
        </div>
    </nav>

    <!-- Search Bar (hidden by default) -->
    <div class="search-overlay" id="searchOverlay">
        <div class="search-container">
            <input type="text" placeholder="Search across all modules..." id="globalSearch" autofocus>
            <button class="search-close" id="searchClose"><i class="fa-solid fa-xmark"></i></button>
        </div>
    </div>

    <!-- Sidebar - will be built dynamically by JS based on user role -->
    <aside class="sidebar" id="sidebar">
        <!-- Sidebar content built by buildSidebar() in app.js -->
    </aside>

    <!-- Sidebar Overlay for mobile -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Main Content -->
    <main class="main-content" id="mainContent">
        <!-- Pages rendered here by JS -->
    </main>

    <!-- Detail Panel -->
    <div class="detail-panel-overlay" id="detailPanelOverlay">
        <div class="detail-panel" id="detailPanel">
            <div class="detail-panel-header" id="detailPanelHeader"></div>
            <div class="detail-panel-body" id="detailPanelBody"></div>
        </div>
    </div>

    <!-- Universal Dynamic Modal -->
    <div class="modal-overlay" id="crudModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Title</h2>
                <button class="modal-close" id="closeModal"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer" id="modalFooter"></div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal-overlay" id="deleteModal">
        <div class="modal" style="max-width:400px">
            <div class="modal-header">
                <h2>Confirm Delete</h2>
                <button class="modal-close" onclick="closeDeleteModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body" style="text-align:center;padding:30px">
                <i class="fa-solid fa-triangle-exclamation" style="font-size:48px;color:#e91e63;margin-bottom:16px;display:block"></i>
                <p style="font-size:16px;color:var(--gray-700)" id="deleteMessage">Are you sure you want to delete this item?</p>
                <p style="font-size:13px;color:var(--gray-500);margin-top:8px">This action cannot be undone.</p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" style="background:#c62828" id="confirmDeleteBtn">Delete</button>
                <button class="btn btn-secondary" onclick="closeDeleteModal()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="main-footer" id="mainFooter">
        2026 &copy; Green Growth.
    </footer>

    <script src="js/app.js"></script>

    <!-- PWA Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registered:', reg.scope))
                    .catch(err => console.log('SW registration failed:', err));
            });
        }
    </script>
</body>
</html>
